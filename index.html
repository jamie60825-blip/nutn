
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1">
<title>台灣地形 AR 探索</title>

<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  overflow: hidden;
  font-family: "Microsoft JhengHei", sans-serif;
}

.panel {
  position: fixed;
  left: 5%;
  width: 90%;
  padding: 15px;
  border-radius: 16px;
  background: rgba(9,23,37,.88);
  color: white;
  text-align: center;
  z-index: 1000;
}

#header { top: 15px; }
#footer { bottom: 20px; }

h2 {
  margin: 0 0 8px;
  color: #92e4f3;
}

#status, #debug {
  font-size: 13px;
  line-height: 1.6;
}

#debug { color: #9bd9c8; }

button {
  border: 1px solid #92e4f3;
  background: #173e50;
  color: white;
  border-radius: 10px;
  padding: 10px 18px;
  margin: 5px;
  font-size: 16px;
}

#controls {
  margin-top: 8px;
}
</style>

<script>
// 在模型載入後，依實際尺寸重新置中及縮放
AFRAME.registerComponent('fit-taiwan', {
  init: function () {
    this.el.addEventListener('model-loaded', () => {
      const THREE = AFRAME.THREE;
      const model = this.el.getObject3D('mesh');

      if (!model) return;

      model.position.set(0, 0, 0);
      model.scale.set(1, 1, 1);
      model.updateMatrixWorld(true);

      const box = new THREE.Box3().setFromObject(model);

      const size = new THREE.Vector3();
      const center = new THREE.Vector3();

      box.getSize(size);
      box.getCenter(center);

      const maxSize = Math.max(
        size.x, size.y, size.z
      );

      if (!Number.isFinite(maxSize) || maxSize <= 0) {
        document.getElementById('status').textContent =
          '模型尺寸異常，請檢查 GLB';
        return;
      }

      // 最長邊固定為 AR 圖卡座標的 0.4 單位
      const normalizedScale = 0.4 / maxSize;

      // 同時縮放幾何與中心偏移
      model.scale.setScalar(normalizedScale);
      model.position.set(
        -center.x * normalizedScale,
        -center.y * normalizedScale,
        -center.z * normalizedScale
      );

      model.updateMatrixWorld(true);

      window.terrainModel = model;
      window.baseScale = normalizedScale;
      window.currentFactor = 1;

      document.getElementById('debug').textContent =
        '模型尺寸：' +
        size.x.toFixed(1) + ' × ' +
        size.y.toFixed(1) + ' × ' +
        size.z.toFixed(1);

      document.getElementById('status').textContent =
        '模型已載入，請掃描圖卡';

      console.log('模型尺寸', size);
      console.log('模型中心', center);
      console.log('縮放倍率', normalizedScale);
    });
  }
});

function resizeTerrain(factor) {
  if (!window.terrainModel) return;

  window.currentFactor *= factor;

  window.currentFactor = Math.max(
    0.01,
    Math.min(5, window.currentFactor)
  );

  const scale =
    window.baseScale * window.currentFactor;

  window.terrainModel.scale.setScalar(scale);

  // 重新依縮放倍率計算置中位置
  const model = window.terrainModel;
  const center = window.originalCenter;

  if (center) {
    model.position.set(
      -center.x * scale,
      -center.y * scale,
      -center.z * scale
    );
  }

  document.getElementById('ratio').textContent =
    Math.round(window.currentFactor * 100) + '%';
}
</script>
</head>

<body>

<div class="panel" id="header">
  <h2>台灣地形 AR 探索</h2>
  <div id="status">正在載入模型...</div>
  <div id="debug"></div>
</div>

<div class="panel" id="footer">
  <strong>台灣地形觀察任務</strong>
  <p>觀察山地、丘陵、平原與海岸。</p>

  <div id="controls">
    <button onclick="resizeTerrain(0.5)">
      − 縮小
    </button>

    <span id="ratio">100%</span>

    <button onclick="resizeTerrain(2)">
      ＋ 放大
    </button>
  </div>
</div>

<a-scene
  mindar-image="imageTargetSrc: ./targets.mind;
                autoStart: true;
                maxTrack: 1;"
  color-space="sRGB"
  renderer="colorManagement: true"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">

  <a-assets>
    <a-asset-item
      id="terrainAsset"
      src="./terrain.glb">
    </a-asset-item>
  </a-assets>

  <a-camera
    position="0 0 0"
    look-controls="enabled: false">
  </a-camera>

  <a-entity
    id="target"
    mindar-image-target="targetIndex: 0">

    <a-entity
      id="taiwan"
      gltf-model="#terrainAsset"
      fit-taiwan
      position="0 0 0.05">
    </a-entity>

  </a-entity>
</a-scene>

<script>
const target = document.querySelector('#target');

target.addEventListener('targetFound', () => {
  document.getElementById('status').textContent =
    '✓ AR 辨識成功！';
});

target.addEventListener('targetLost', () => {
  document.getElementById('status').textContent =
    '請重新對準圖卡';
});

document.querySelector('#taiwan')
  .addEventListener('model-loaded', () => {

    const model = document.querySelector('#taiwan')
      .getObject3D('mesh');

    if (!model) return;

    // 供放大縮小按鈕使用
    const box = new AFRAME.THREE.Box3()
      .setFromObject(model);

    const center = new AFRAME.THREE.Vector3();
    box.getCenter(center);

    // 此時模型已被縮放，因此從幾何重新取得
    const originalBox = new AFRAME.THREE.Box3();
    const clone = model.clone();
    clone.position.set(0, 0, 0);
    clone.scale.set(1, 1, 1);
    clone.updateMatrixWorld(true);
    originalBox.setFromObject(clone);

    window.originalCenter =
      originalBox.getCenter(
        new AFRAME.THREE.Vector3()
      );
  });
</script>

</body>
</html>
